<style>
:root{
  --bg:#fff; --soft:#f5f7fb; --soft2:#eceff6;
  --ink:#16213a; --ink2:#586580; --ink3:#8c97ab;
  --blue:#3f6fd9; --blue-d:#2f5bc0; --blue-t:#e9effe;
  --green:#23804a; --green-t:#e3f5ea;
  --gray:#6b768b; --gray-t:#eef1f6;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.fade{animation:fade .2s ease-out}
h1,h2,.hello b,.logo,.phead b{font-weight:700;letter-spacing:-.035em}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:16px;padding:28px max(48px,calc((100vw - 1080px)/2)) 18px;position:sticky;top:0;background:linear-gradient(var(--bg) 78%,transparent);z-index:5}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.04em;color:var(--blue)}
.logo img{flex:none;border-radius:8px;display:block;object-fit:cover}
.grow{flex:1}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--blue);font-weight:500;padding:6px 10px 6px 4px;margin-left:-4px;border-radius:9px;transition:background .15s}
.back:hover{background:var(--blue-t)}
.me{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 14px 4px 4px;border-radius:999px;text-align:left;transition:background .15s}
.me:hover,.me[aria-expanded=true]{background:var(--soft)}
.me svg{color:var(--ink3)}
.me b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.me small{color:var(--ink3);font-size:12px}

/* ---------- avatars ---------- */
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11.5px;flex:none;background:var(--blue-t);color:var(--blue)}
.av.sq{border-radius:10px;width:34px;height:34px;font-size:12px}
.av.xs{width:22px;height:22px;font-size:10px}

/* ---------- layout ---------- */
.shell{max-width:1176px;margin:0 auto;padding:20px 48px 140px;display:block}
.main{min-width:0}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:36px}
.ttl h1{font-size:26px;color:var(--blue)}
.page{max-width:1176px;margin:0 auto;padding:16px 48px 140px;overflow-x:clip}

/* ---------- sidebar ---------- */
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:32px;max-height:calc(100vh - 100px);overflow:auto;scrollbar-width:none}
.hello{display:flex;align-items:center;gap:12px}
.hello{justify-content:space-between}
.hello b{display:block;font-size:16px;line-height:1.2}
.hello .x{width:28px;height:28px}

/* ---------- toolbar ---------- */
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:26px}
.search{display:flex;align-items:center;gap:9px;background:var(--soft);border-radius:12px;height:38px;padding:0 14px;flex:1;min-width:180px;max-width:560px;color:var(--ink3);transition:box-shadow .15s,background .15s}
.bar .ctl{margin-left:auto}
.search:focus-within{background:#fff;box-shadow:0 0 0 2px var(--blue)}
.search input{border:0;background:none;outline:0;width:100%;color:var(--ink)}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{border:0;background:none;height:32px;padding:0 12px;border-radius:9px;font-weight:500;color:var(--ink2);display:inline-flex;gap:6px;align-items:center;transition:background .18s,color .18s,box-shadow .18s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(22,33,58,.1)}
.seg button i{font-style:normal;color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.btn{height:38px;padding:0 15px;font-size:13px;border-radius:12px;border:0;background:var(--soft);font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:background .15s,transform .1s}
.btn:hover{background:var(--soft2)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-d)}
.btn.on{background:var(--blue-t);color:var(--blue)}
.badge{background:var(--blue);color:#fff;border-radius:999px;min-width:19px;height:19px;font-size:11px;display:grid;place-items:center;padding:0 5px;animation:pop2 .2s ease-out}
@keyframes pop2{from{transform:scale(.5);opacity:0}}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-8px 0 20px}
.tags:empty{display:none}
.tag{background:var(--blue-t);color:var(--blue);border-radius:999px;height:28px;padding:0 5px 0 12px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:3px;animation:pop2 .2s ease-out}
.tag button{border:0;background:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:inherit;padding:0}
.tag button:hover{background:rgba(63,111,217,.16)}
.tags .link{font-size:12.5px;margin-left:2px}
.link{border:0;background:none;color:var(--blue);font-weight:600;padding:6px 4px;border-radius:8px}
.link:hover{text-decoration:underline}

/* ---------- list ---------- */
.head,.row{display:grid;grid-template-columns:minmax(150px,1.5fr) minmax(0,1.5fr) minmax(80px,.8fr) 180px 152px 112px 30px;gap:12px;align-items:center;padding:0 14px}
.head{height:40px;color:var(--ink3);font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.row{min-height:70px;border-radius:16px;transition:background .15s}
.row:hover{background:var(--soft)}
.nm{display:flex;align-items:center;gap:12px;min-width:0}
.name{border:0;background:none;text-align:left;font-weight:600;font-size:14px;padding:4px 0;color:var(--ink);line-height:1.3;overflow-wrap:anywhere;transition:color .15s}
.name:hover{color:var(--blue)}
.avw{position:relative;flex:none}
.avw .mini{position:absolute;right:-6px;bottom:-6px;width:18px;height:18px;font-size:8.5px;box-shadow:0 0 0 2px #fff}
.ghost{width:100%;min-width:0;border:0;background:none;border-radius:9px;padding:7px 9px;margin-left:-9px;color:var(--ink2);text-overflow:ellipsis;transition:background .15s,box-shadow .15s}
.ghost:hover{background:var(--soft2)}
.ghost:focus{outline:0;background:#fff;box-shadow:0 0 0 2px var(--blue)}
.ghost.email{color:var(--blue)}
.em{display:flex;align-items:center;gap:0;min-width:0;margin-left:-9px}
.em .ghost{margin-left:0}
.cp{width:28px;height:28px;border-radius:8px;border:0;background:none;color:var(--ink3);display:grid;place-items:center;flex:none;transition:background .15s,color .15s,transform .1s}
.cp:hover{background:var(--blue-t);color:var(--blue)}.cp:active{transform:scale(.88)}
.cp.ok{color:var(--green);background:var(--green-t)}
.x{width:32px;height:32px;border-radius:50%;border:0;background:none;color:var(--ink3);display:grid;place-items:center;flex:none;transition:background .15s,color .15s,transform .1s}
.x:hover{background:#fdecee;color:#c24b57}.x:active{transform:scale(.9)}
.empty{padding:70px 20px;text-align:center;color:var(--ink2)}
.empty .big{font-size:38px;display:block;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:4px}
.empty .btn{margin-top:16px}
.row.in{animation:rowin .34s ease-out both;animation-delay:calc(var(--i)*28ms)}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}}

/* ---------- status dropdowns ---------- */
.s-gray{--c:var(--gray);--t:var(--gray-t)} .s-blue{--c:var(--blue);--t:var(--blue-t)}
.s-green{--c:var(--green);--t:var(--green-t)}
.dd{position:relative;display:inline-flex;max-width:100%}
.dd-btn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 9px 0 11px;border:0;border-radius:999px;background:var(--t);color:var(--c);font-weight:600;font-size:12px;max-width:100%;transition:box-shadow .15s,transform .1s}
.dd-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.dd-btn svg{flex:none;opacity:.5;transition:transform .2s ease}
.dd-btn[aria-expanded=true] svg{transform:rotate(180deg)}
.dd-btn:hover{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 12%,transparent)}
.dd-btn:active{transform:scale(.97)}
.dd.plain .dd-btn{--c:var(--ink);background:var(--soft);height:38px;padding:0 11px 0 14px;font-weight:500;font-size:13.5px}
.dd.plain .dd-btn:hover{background:var(--soft2);box-shadow:none}
.dd.sm .dd-btn{height:30px;font-size:12.5px;padding:0 9px 0 12px}
.menu{position:fixed;z-index:30;min-width:200px;background:#fff;border-radius:16px;padding:6px;box-shadow:0 0 0 1px rgba(22,33,58,.05),0 14px 40px rgba(22,33,58,.14);animation:pop .14s ease-out;transform-origin:var(--o,top left)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.97)}}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px;font-size:13.5px;color:var(--ink);transition:background .12s}
.menu button:hover,.menu button:focus-visible{background:var(--soft);outline:0}
.menu button i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink3));flex:none}
.menu button.on{font-weight:600}
.menu button .ck{margin-left:auto;color:var(--blue);opacity:0;transform:scale(.7);transition:.18s}
.menu button.on .ck{opacity:1;transform:none}

/* ---------- filter panel ---------- */
.sheet-bg{display:none}
.panel.cal{width:340px}
.panel.cal .pbody{padding-bottom:22px}
.panel{position:fixed;z-index:40;width:360px;max-width:calc(100vw - 24px);background:#fff;border-radius:22px;box-shadow:0 0 0 1px rgba(22,33,58,.05),0 20px 60px rgba(22,33,58,.18);display:flex;flex-direction:column;animation:pop .16s ease-out;transform-origin:top right}
.phead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px}
.phead b{font-size:16px;letter-spacing:-.02em}
.pbody{overflow:auto;padding:6px 20px 8px;overscroll-behavior:contain}
.pbody h4{margin:16px 0 9px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.chipset{display:flex;flex-wrap:wrap;gap:7px}
.fchip{border:0;background:var(--soft);border-radius:999px;height:32px;padding:0 12px;font-size:13px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;transition:background .15s,color .15s,transform .1s}
.fchip:hover{background:var(--soft2)}.fchip:active{transform:scale(.96)}
.fchip i{font-style:normal;color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.fchip.on{background:var(--blue-t);color:var(--blue);font-weight:600}.fchip.on i{color:var(--blue)}
.pfoot{padding:12px 20px 18px}
.pfoot .btn{width:100%;justify-content:center;height:42px}

/* ---------- board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;margin:0 -4px;padding:0 4px 14px;scrollbar-width:thin;overscroll-behavior-x:contain}
.kcol{background:var(--soft);border-radius:22px;padding:14px 12px 12px;min-height:300px;transition:background .18s,box-shadow .18s}
.kcol.over{background:var(--t);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent)}
.khead{display:flex;align-items:center;gap:8px;padding:0 6px 12px;font-size:13px}
.khead i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.khead b{font-weight:600}
.khead span{margin-left:auto;color:var(--ink3);font-variant-numeric:tabular-nums;font-size:12.5px}
.kbody{display:flex;flex-direction:column;gap:10px}
.kcard{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 1px 2px rgba(22,33,58,.06);cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .18s ease,box-shadow .18s ease,opacity .15s}
.kcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(22,33,58,.1)}
.kt{font-weight:600;font-size:13.5px;line-height:1.35;margin-bottom:3px}
.kl{color:var(--ink3);font-size:12.5px}
.kf{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px;min-height:22px}
.ptag{background:var(--soft);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500;color:var(--ink2)}
.kcard.lift{opacity:.3;transform:none;box-shadow:none}
.kcard.drop{animation:drop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:scale(.92);opacity:.4}}
.kempty{margin:18px 0;text-align:center;color:var(--ink3);font-size:12.5px}
.kghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 18px 44px rgba(22,33,58,.22);will-change:transform}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
body.dragging *{cursor:grabbing!important}

/* ---------- profile ---------- */
.title{display:flex;align-items:center;margin-top:0;min-height:40px}
h1{margin:0;font-size:24px;letter-spacing:-.035em;line-height:1.25;overflow-wrap:anywhere}
h1.edit{cursor:text;border-radius:10px;padding:1px 8px;margin-left:-8px;transition:background .15s}
h1.edit:hover{background:var(--soft)}
.title-in{field-sizing:content;font:inherit;font-size:24px;font-weight:700;letter-spacing:-.035em;line-height:1.25;min-width:12ch;max-width:100%;border:0;border-radius:10px;padding:1px 8px;margin-left:-8px;background:var(--soft);outline:0;box-shadow:0 0 0 2px var(--blue)}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.meta .own{color:var(--ink3);font-size:12.5px;margin-left:8px}
.sub{color:var(--ink2);margin:16px 0 0;max-width:640px;line-height:1.65}
.sub.loc{color:var(--ink3);margin-top:12px}
.stack{display:flex;flex-direction:column;gap:28px}
.card{background:var(--soft);border-radius:24px;padding:30px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.sec h2{margin:0;font-size:14.5px}
.sec p{margin:2px 0 0;color:var(--ink3);font-size:12.5px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.person{position:relative;background:#fff;border-radius:18px;padding:20px;display:flex;gap:12px;transition:transform .18s}
.person:hover{transform:translateY(-1px)}
.person .x{position:absolute;right:6px;top:6px;width:28px;height:28px}
.person .f{min-width:0;flex:1;padding-right:22px}
.person input{display:block;width:100%;border:0;background:none;border-radius:7px;padding:2px 6px;margin-left:-6px;font-size:13px;color:var(--ink2);transition:background .15s}
.person input:hover{background:var(--soft)}
.person input:focus{outline:0;background:var(--soft);box-shadow:0 0 0 2px var(--blue)}
.person input.n{font-weight:600;color:var(--ink);font-size:14px}
.person input.m{color:var(--blue)}
textarea{width:100%;border:0;border-radius:14px;background:#fff;padding:14px;line-height:1.6;resize:vertical}
textarea:focus{outline:0;box-shadow:0 0 0 2px var(--blue)}
.notes{display:flex;flex-direction:column}
.notes textarea{flex:1;min-height:220px;resize:none}
.saved{color:var(--ink3);font-size:12px;margin-top:8px;min-height:18px}
.acts{display:flex;flex-direction:column;gap:10px}
.act{background:#fff;border-radius:16px;overflow:hidden}
.act>button{width:100%;border:0;background:none;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;transition:background .15s}
.act>button:hover{background:#fafbfd}
.ic{width:32px;height:32px;border-radius:10px;background:var(--blue-t);color:var(--blue);display:grid;place-items:center;flex:none}
.act small{display:block;color:var(--ink3);font-size:12px}
.act strong{font-size:14px;font-weight:600}
.act .body{padding:0 14px 14px;animation:bodyin .2s ease-out}
@keyframes bodyin{from{opacity:0;transform:translateY(-4px)}}
.act .body input{width:100%;border:0;border-radius:10px;background:var(--soft);padding:8px 11px;margin-bottom:8px;font-weight:600}
.act .body input:focus{outline:0;box-shadow:0 0 0 2px var(--blue)}
.act .body textarea{background:var(--soft)}
.act .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--ink3);font-size:12px}


/* ---------- organization page ---------- */
.hero{display:flex;gap:22px;align-items:flex-start;margin-top:8px}
.hero .hb{min-width:0;flex:1}
.hero .sub{margin:6px 0 0}
.avw.big .av.sq{width:68px;height:68px;border-radius:22px;font-size:22px}
.avw.big .mini{width:26px;height:26px;font-size:10.5px;right:-8px;bottom:-8px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}
.fact{background:var(--soft);border-radius:22px;padding:18px 20px;display:flex;gap:14px;align-items:center;min-width:0}
.fact>div{min-width:0}
.fact small{display:block;color:var(--ink3);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.fact b{display:block;font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact em{display:block;font-style:normal;color:var(--ink3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi{width:42px;height:42px;border-radius:14px;background:#fff;color:var(--blue);display:grid;place-items:center;flex:none}
.fm{flex:none;display:block;line-height:0}
.tabs{display:flex;justify-content:center;gap:44px;margin:44px 0 32px;position:relative;box-shadow:0 1px 0 var(--soft2);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:0 4px 12px;color:var(--ink3);font-weight:500;white-space:nowrap;transition:color .2s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--blue);font-weight:600}
.tab-ind{position:absolute;left:0;bottom:0;height:2px;border-radius:2px;background:var(--blue);transition:transform .32s cubic-bezier(.4,0,.2,1),width .32s cubic-bezier(.4,0,.2,1)}
#tabbody{display:flex;flex-direction:column;gap:28px}
#tabbody.sl-r{animation:slr .34s cubic-bezier(.2,.7,.3,1)}
#tabbody.sl-l{animation:sll .34s cubic-bezier(.2,.7,.3,1)}
@keyframes slr{from{opacity:0;transform:translateX(40px)}}
@keyframes sll{from{opacity:0;transform:translateX(-40px)}}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:stretch}
.steps{display:flex;margin-top:14px}
.step{flex:1;border:0;background:none;position:relative;text-align:center;padding:0 2px;color:var(--ink3);font-size:12px;font-weight:500}
.step:not(:last-child):before{content:"";position:absolute;top:30px;left:calc(50% + 38px);right:calc(-50% + 38px);border-top:2px dotted #c3cde2;transition:border-color .35s}
.step.done:not(:last-child):before{border-top-color:var(--blue)}
.mood{display:block;width:60px;height:60px;margin:0 auto 10px;transition:transform .22s ease,opacity .22s,filter .22s}
.mood svg{display:block}
.step:hover .mood{transform:translateY(-3px)}
.step:active .mood{transform:scale(.94)}
.step.todo .mood{filter:grayscale(1);opacity:.45}
.step.todo:hover .mood{filter:none;opacity:.9}
.step.cur .mood{transform:scale(1.14)}
.step.cur{color:var(--ink);font-weight:600}
/* timeline */
.tl{display:flex;flex-direction:column}
.tli{position:relative;padding-left:58px;padding-bottom:16px}
.tli:last-child{padding-bottom:0}
.tli:not(:last-child):before{content:"";position:absolute;left:18px;top:44px;bottom:4px;border-left:2px dotted #b4c2de}
.tli .dot{position:absolute;left:0;top:2px;width:38px;height:38px;border-radius:50%;background:var(--blue-t);color:var(--blue);display:grid;place-items:center;box-shadow:0 0 0 4px var(--soft)}
.tli.up .dot{background:#fff;border:1.8px dashed var(--blue)}
.upc{display:block;width:100%;border:0;background:#fff;border-radius:16px;padding:12px 14px;text-align:left;transition:background .15s}
.upc:hover{background:#fafbfd}
.upc small{display:block;color:var(--ink3);font-size:12px}
.upc strong{font-size:14px;font-weight:600}
@media (max-width:900px){.facts{grid-template-columns:1fr}.split{grid-template-columns:1fr}.hero{gap:16px}.avw.big .av.sq{width:56px;height:56px;border-radius:18px;font-size:18px}.tabs{gap:28px}}

/* ---------- projects ---------- */
.proj{background:#fff;border-radius:18px;padding:22px}
.proj+.proj{margin-top:16px}
.ph{display:flex;align-items:center;gap:8px}
.pn{flex:1;min-width:0;border:0;background:none;font-size:16px;font-weight:700;letter-spacing:-.02em;border-radius:8px;padding:4px 8px;margin-left:-8px}
.pn:hover{background:var(--soft)}
.pn:focus{outline:0;background:var(--soft);box-shadow:0 0 0 2px var(--blue)}
.proj textarea{background:var(--soft);min-height:64px;margin:8px 0 14px;font-size:13.5px}
.pl{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:13px;margin-bottom:20px}
.pl input{border:0;background:var(--soft);border-radius:10px;height:32px;padding:0 11px;font-size:13px;width:200px;max-width:100%}
.pl input:focus,.lk input:focus{outline:0;box-shadow:0 0 0 2px var(--blue)}
.lk{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.lk input{border:0;background:var(--soft);border-radius:10px;height:34px;padding:0 11px;font-size:13px}
.lk .lkl{width:140px;flex:none}
.lk .lku{flex:1;min-width:0;color:var(--blue)}
.open{width:34px;height:34px;border-radius:10px;background:var(--blue-t);color:var(--blue);display:grid;place-items:center;flex:none;transition:background .15s,transform .1s}
.open:hover{background:#dbe6fd}.open:active{transform:scale(.92)}
.open:not([href]){opacity:.35;pointer-events:none}

/* ---------- toast / confetti ---------- */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 10px 9px 16px;border-radius:14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:60;animation:toastin .22s ease-out;max-width:calc(100vw - 32px)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}}
.toast button{border:0;background:none;color:#a9c1ff;font-weight:700;padding:4px 8px;border-radius:8px}
.cf{position:fixed;width:7px;height:9px;border-radius:2px;pointer-events:none;z-index:70;animation:cf .85s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

@media (prefers-reduced-motion:reduce){
  .row.in,.menu,.panel,.act .body,.toast,.kcard.drop,.badge,.tag{animation:none}
  *{transition-duration:.01ms!important}
}

/* ---------- overview (sidebar) ---------- */
.calw{display:flex;flex-direction:column;gap:22px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;min-height:26px}
.calh b{font-size:13px;letter-spacing:-.01em;white-space:nowrap;font-weight:600}
.nav{display:flex;gap:2px;align-items:center}
.nav button{border:0;background:none;min-width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);transition:background .15s}
.nav button:hover{background:var(--soft)}
.nav .tdy{padding:0 8px;font-size:12px;font-weight:600;color:var(--blue)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cd{position:relative;border:0;background:none;padding:6px 0 9px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;color:var(--ink);transition:background .15s}
.cd small{font-size:10.5px;color:var(--ink3);font-weight:500}
.cd:hover{background:var(--soft)}
.cd.sel{background:var(--blue-t)}
.cd span{width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cd.today span{background:var(--blue);color:#fff;font-weight:600}
.cd i{position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--blue)}
.cl h4{margin:0 0 8px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);display:flex;justify-content:space-between;align-items:center}
.cl h4 .link{font-size:12px;text-transform:none;letter-spacing:0;padding:0 2px}
.ev{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-radius:12px}
.chk{width:18px;height:18px;border-radius:50%;border:1.8px solid #c7d0e2;background:none;flex:none;margin-top:1px;display:grid;place-items:center;padding:0;color:#fff;transition:background .15s,border-color .15s,transform .1s}
.chk:hover{border-color:var(--blue)}.chk:active{transform:scale(.88)}
.chk.on{background:var(--blue);border-color:var(--blue)}
.evb{border:0;background:none;text-align:left;padding:0;min-width:0;flex:1}
.evb .t{display:block;font-weight:600;font-size:13px;line-height:1.3;transition:color .15s}
.evb .s{display:block;color:var(--ink3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evb .s.od{color:var(--ink);font-weight:600}
.evb:hover .t{color:var(--blue)}
.ev.done .t{text-decoration:line-through;color:var(--ink3)}
.cempty{color:var(--ink3);font-size:12.5px;padding:4px}
.btn.tgl{width:38px;padding:0;justify-content:center}

/* ---------- profile events ---------- */
.cad{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--ink2);font-size:13px;flex-wrap:wrap}
.evr{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:10px 12px;flex-wrap:wrap}
.evr+.evr{margin-top:10px}
.evr .ic{width:28px;height:28px;border-radius:9px}
.evr .evt{flex:1 1 140px;min-width:0;border:0;background:none;border-radius:8px;padding:6px 8px;font-weight:500;font-size:13.5px}
.evr .evt:hover{background:var(--soft)}
.evr .evt:focus{outline:0;background:var(--soft);box-shadow:0 0 0 2px var(--blue)}
.evr.done .evt{text-decoration:line-through;color:var(--ink3)}
.evr .evd{border:0;background:var(--soft);border-radius:10px;padding:6px 8px;font-size:13px;color:var(--ink2);height:32px}
.evr .evd:focus{outline:0;box-shadow:0 0 0 2px var(--blue)}
.addev{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.addev .fchip{background:#fff}.addev .fchip:hover{background:var(--blue-t);color:var(--blue)}
.hint{color:var(--ink3);font-size:13px;margin:0}

/* ---------- intake form ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(22,33,58,.35);z-index:45;animation:fade .18s}
.modal{position:fixed;z-index:46;left:50%;top:50%;transform:translate(-50%,-50%);width:540px;max-width:calc(100vw - 24px);max-height:calc(100vh - 48px);background:#fff;border-radius:26px;box-shadow:0 24px 80px rgba(22,33,58,.25);display:flex;flex-direction:column;animation:mpop .2s ease-out}
@keyframes mpop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}}
.mh{padding:24px 28px 6px;position:relative}
.mh h2{margin:0;font-size:20px;letter-spacing:-.02em}
.mh p{margin:4px 0 0;color:var(--ink3)}
.mh .x{position:absolute;right:16px;top:16px}
.mbody{padding:14px 28px;overflow:auto;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fl{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--ink2);font-weight:500;min-width:0}
.fl input,.fl textarea{border:0;background:var(--soft);border-radius:12px;padding:0 13px;height:40px;font-size:14px;color:var(--ink);width:100%}
.fl textarea{height:auto;padding:10px 13px;min-height:72px;resize:none}
.fl input:focus,.fl textarea:focus{outline:0;background:#fff;box-shadow:0 0 0 2px var(--blue)}
.fl input.bad{box-shadow:0 0 0 2px #c24b57;background:#fff}
.err{color:#c24b57;font-size:12.5px;font-weight:500}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:12px 28px 24px}

/* ---------- tablet / phone ---------- */
@media (max-width:980px){
  .top{padding:16px 24px 12px}
  .shell{grid-template-columns:1fr;gap:20px;padding:4px 24px 120px}
  .page{padding:4px 24px 120px}
  .side{position:static;gap:14px}
  .head{display:none}
  .row{grid-template-columns:1fr 1fr 34px;grid-template-areas:"n n x" "e e e" "l o o" "c p p";row-gap:8px;padding:16px 12px}
  .row .c-n{grid-area:n}.row .c-e{grid-area:e}.row .c-l{grid-area:l}.row .c-c{grid-area:c}.row .c-p{grid-area:p}.row .c-x{grid-area:x}.row .c-o{grid-area:o}
  .cols{grid-template-columns:1fr}

}
@media (max-width:700px){
  .top{padding:14px 16px 10px}
  .shell,.page{padding-left:16px;padding-right:16px}
  .me div{display:none}
  .hello b{font-size:16px}
  .search{max-width:none;flex-basis:100%}
  .bar .btn.pri{margin-left:auto}
  input,select,textarea{font-size:16px!important}
  h1,.title-in{font-size:22px!important}
  .step{font-size:10.5px}
  .card{padding:18px;border-radius:20px}
  .sheet-bg{display:block;position:fixed;inset:0;background:rgba(22,33,58,.35);z-index:39;animation:fade .2s}
  .panel{left:0!important;right:0!important;top:auto!important;bottom:0;width:auto;max-width:none;border-radius:24px 24px 0 0;max-height:82vh;transform-origin:bottom;animation:sheet .22s ease-out;padding-bottom:env(safe-area-inset-bottom)}
  @keyframes sheet{from{transform:translateY(40px);opacity:0}}
  .board{grid-auto-columns:78vw;scroll-snap-type:x proximity}
  .kcol{scroll-snap-align:start}

/* ---------- cute: confetti + count up ---------- */
function burst(x,y){
  if(reduce())return;
  for(let i=0;i<18;i++){
    const e=document.createElement('i');e.className='cf';
    const a=Math.random()*Math.PI*2,d=40+Math.random()*70;
    e.style.cssText=`left:${x}px;top:${y}px;background:${CONF[i%CONF.length]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-30+60*Math.random()}px;--r:${Math.random()*540-270}deg`;
    document.body.appendChild(e);setTimeout(()=>e.remove(),900);
  }
}
function countUp(){
  if(reduce())return;
  document.querySelectorAll('.stat b').forEach(el=>{const n=+el.dataset.n,t0=performance.now();
    (function f(t){const k=Math.min(1,(t-t0)/650);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)});
}

function moveOrg(id,cs,focus){

function startDrag(){
  const d=D;d.active=true;closeMenu();
  const r=d.card.getBoundingClientRect();
  d.ox=d.x-r.left;d.oy=d.y-r.top;
  const g=d.card.cloneNode(true);g.className='kghost';g.style.width=r.width+'px';g.removeAttribute('tabindex');
  document.body.appendChild(g);d.ghost=g;d.card.classList.add('lift');document.body.classList.add('dragging');
  navigator.vibrate&&navigator.vibrate(8);moveGhost();
}
function moveGhost(){
  const d=D;d.ghost.style.transform=`translate(${d.x-d.ox}px,${d.y-d.oy}px) rotate(3deg) scale(1.03)`;
  const el=document.elementFromPoint(d.x,d.y),col=el&&el.closest('.kcol');
  document.querySelectorAll('.kcol.over').forEach(c=>c!==col&&c.classList.remove('over'));
  col&&col.classList.add('over');
  const b=$('#board');if(b){const r=b.getBoundingClientRect();if(d.x<r.left+56)b.scrollLeft-=16;else if(d.x>r.right-56)b.scrollLeft+=16}
}
function endDrag(ok){
  if(!D)return;
  clearTimeout(D.timer);const d=D;D=null;
  if(!d.active){if(ok&&!d.moved)openOrg(d.id);return}
  const el=document.elementFromPoint(d.x,d.y),col=el&&el.closest('.kcol');
  d.ghost.remove();d.card.classList.remove('lift');document.body.classList.remove('dragging');
  document.querySelectorAll('.kcol.over').forEach(c=>c.classList.remove('over'));
  if(ok&&col)moveOrg(d.id,col.dataset.col);
}

  if(D.touch)D.timer=setTimeout(()=>{if(D&&!D.active)startDrag()},320);

document.addEventListener('pointermove',e=>{

    if(D.touch){if(dist>8){clearTimeout(D.timer);D=null}}
    else if(dist>5){D.moved=true;startDrag()}

  }

  else if(a==='ctoday'){S.cal=ymd(addDays(new Date(),-new Date().getDay()));S.calDay=null;refreshCal()}
  else if(a==='copy'){
    const v=b.previousElementSibling.value.trim();
    if(!v){toast('No email to copy yet');return}
    copyText(v).then(ok=>{
      if(!ok){toast('Couldn’t copy. Select the email and press Ctrl+C');return}
      b.classList.add('ok');b.innerHTML=ico('check',15);b.setAttribute('aria-label','Copied');
      setTimeout(()=>{b.classList.remove('ok');b.innerHTML=ico('copy',15);b.setAttribute('aria-label','Copy email')},1400);
    });
  }
  else if(a==='cal'){calOpen?closeCal():openCal()}
  else if(a==='calclose')closeCal();
  else if(a==='evdone')toggleEv(+b.dataset.eid);
  else if(a==='evopen')openOrg(id);
  else if(a==='addev')addEv(cur()[0].id,b.dataset.t);
  else if(a==='evdel'){const k=S.events.findIndex(x=>x.id===+b.dataset.eid),ev=S.events.splice(k,1)[0];save();renderProfile();toast('Event deleted',()=>{S.events.splice(k,0,ev);save();renderProfile()})}
  else if(a==='del'){
    const idx=S.orgs.findIndex(o=>o.id===id),o=S.orgs[idx];
    S.orgs.splice(idx,1);save();refreshList(false);refreshCal();
    toast(`Deleted “${o.name}”`,()=>{S.orgs.splice(idx,0,o);save();refreshList(false);refreshCal()});
  }
  else if(a==='tab')switchTab(b.dataset.t);
  else if(a==='rename'){S.edit=true;renderProfile()}
  else if(a==='addc'){cur()[1].contacts.push({name:'New contact',role:'',email:'',phone:''});save();renderProfile();const n=document.querySelectorAll('.person .n');n[n.length-1].select()}
  else if(a==='delc'){const p=cur()[1],c=p.contacts.splice(i,1)[0];save();renderProfile();toast('Contact removed',()=>{p.contacts.splice(i,0,c);save();renderProfile()})}
  else if(a==='stage'){cur()[1].stage=i;save();renderProfile();if(i===STAGES.length-2){const r=document.querySelector('.step.cur .mood').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2)}}
  else if(a==='act'){S.open=S.open===i?null:i;renderProfile()}
  else if(a==='addproj'){const p=cur()[1];p.projects.push({name:'New project',text:'',lead:'',links:[]});save();renderProfile();const n=document.querySelectorAll('.pn');n[n.length-1].select()}
  else if(a==='delproj'){const p=cur()[1],pi=+b.dataset.pi,x=p.projects.splice(pi,1)[0];save();renderProfile();toast('Project deleted',()=>{p.projects.splice(pi,0,x);save();renderProfile()})}
  else if(a==='addlk'){const p=cur()[1],pi=+b.dataset.pi;p.projects[pi].links.push({label:'Link',url:''});save();renderProfile();const u=document.querySelectorAll('.proj')[pi].querySelectorAll('.lku');u[u.length-1].focus()}
  else if(a==='dellk'){const p=cur()[1],pi=+b.dataset.pi,li=+b.dataset.li,x=p.projects[pi].links.splice(li,1)[0];save();renderProfile();toast('Link removed',()=>{p.projects[pi].links.splice(li,0,x);save();renderProfile()})}
  else if(a==='addact'){const p=cur()[1];p.acts.unshift({t:'mail',date:today(),subject:'New activity',text:'',by:ME});S.open=0;save();renderProfile();document.querySelector('.act .body input').select()}
  else if(a==='delact'){const p=cur()[1],x=p.acts.splice(i,1)[0];S.open=null;save();renderProfile();toast('Activity deleted',()=>{p.acts.splice(i,0,x);save();renderProfile()})}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;$('#list').innerHTML=listBody(false);return}
  if(t.dataset.f&&t.tagName==='INPUT'){const o=S.orgs.find(x=>x.id==t.dataset.id);o[t.dataset.f]=t.value;save();return}
  const p=t.dataset.p;if(!p)return;
  if(p==='evt'||p==='evd'){const ev=S.events.find(x=>x.id==t.dataset.eid);if(ev){if(p==='evt')ev.title=t.value;else if(t.value)ev.date=t.value;save()}return}
  const [o,pr]=cur();
  if(p==='c'){pr.contacts[+t.dataset.i][t.dataset.k]=t.value;if(t.dataset.k==='name'){const av=t.closest('.person').querySelector('.av');av.textContent=ini(t.value)}}
  else if(p==='notes'){pr.notes=t.value;const s=$('#saved');s&&(s.textContent='Saved '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}))}
  else if(p==='actsub'){pr.acts[+t.dataset.i].subject=t.value;t.closest('.act').querySelector('strong').textContent=t.value}
  else if(p==='acttext'){pr.acts[+t.dataset.i].text=t.value}
  else if(p==='pj'){pr.projects[+t.dataset.pi][t.dataset.k]=t.value}
  else if(p==='lk'){
    pr.projects[+t.dataset.pi].links[+t.dataset.li][t.dataset.k]=t.value;
    if(t.dataset.k==='url'){const a=t.closest('.lk').querySelector('.open'),v=t.value.trim();
      if(v)a.href=/^https?:\/\//i.test(v)?v:'https://'+v;else a.removeAttribute('href')}
  }
  save();
});
document.addEventListener('focusout',e=>{
  if(e.target.id==='tin'){const [o,p]=cur();p.name=e.target.value.trim()||o.name;o.name=p.name;S.edit=false;save();renderProfile()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&M){closeIntake();return}
  if(e.key==='Escape'&&calOpen){closeCal();const m=$('.me');m&&m.focus();return}
  if(e.key==='Escape'&&panelOpen){closePanel();$('.fbtn')&&$('.fbtn').focus();return}
  if(menuFor){
    const items=[...document.querySelectorAll('.menu button')],i=items.indexOf(document.activeElement);
    if(e.key==='Escape'){e.preventDefault();closeMenu(true);return}
    if(e.key==='ArrowDown'){e.preventDefault();items[(i+1)%items.length].focus();return}
    if(e.key==='ArrowUp'){e.preventDefault();items[(i-1+items.length)%items.length].focus();return}
    if(e.key==='Tab')closeMenu();
  }
  if(e.target.id==='tin'){if(e.key==='Enter')e.target.blur();if(e.key==='Escape'){e.target.value=cur()[1].name;e.target.blur()}}
  const kc=e.target.closest&&e.target.closest('.kcard');
  if(kc){
    const id=+kc.dataset.id;
    if(e.key==='Enter'){openOrg(id)}
    else if(e.altKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){
      e.preventDefault();const o=S.orgs.find(x=>x.id===id),n=CONTACT.indexOf(o.cs)+(e.key==='ArrowRight'?1:-1);
      if(n>=0&&n<CONTACT.length)moveOrg(id,CONTACT[n],true);
    }
  }
});
addEventListener('resize',()=>{closeMenu();placePanel();placeCal();positionInd(false)});
addEventListener('scroll',()=>{closeMenu();if(panelOpen)placePanel();if(calOpen)placeCal()},true);
render();
</script>
</body>
</html>
